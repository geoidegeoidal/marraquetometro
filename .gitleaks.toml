title = "Marraquetometro secret detection"

[extend]
useDefault = true

[[rules]]
id = "ors-api-key-assignment"
description = "Hardcoded OpenRouteService key"
regex = '''(?i)ORS_API_KEY\s*[:=]\s*["']?([A-Za-z0-9+/=_-]{20,})'''
secretGroup = 1
keywords = ["ors_api_key"]

[[rules]]
id = "ors-encoded-key"
description = "Encoded OpenRouteService credential"
regex = '''\b(eyJvc[^\s"'<>]{80,})'''
secretGroup = 1
keywords = ["eyJvc"]
